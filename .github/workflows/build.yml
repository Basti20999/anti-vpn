name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload Paper jar
        uses: actions/upload-artifact@v4
        with:
          name: AntiVPN-Paper
          path: paper/target/AntiVPN-Paper-*.jar

      - name: Upload Velocity jar
        uses: actions/upload-artifact@v4
        with:
          name: AntiVPN-Velocity
          path: velocity/target/AntiVPN-Velocity-*.jar
